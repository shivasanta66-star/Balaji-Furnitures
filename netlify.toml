# Netlify deploys the static site in public/. The Express server in server.js is
# NOT used here — Netlify serves files, it does not run Node. See README.md
# ("Deploying") for what that means for the enquiry form and admin panel.

[build]
  publish = "public"
  command = ""

# Netlify serves public/404.html for unmatched paths automatically.

# --- security headers -------------------------------------------------------
# helmet sets these when running server.js; Netlify needs them declared.
# The script-src hashes cover the inline JSON-LD blocks in the HTML. If you edit
# a JSON-LD block, re-run: npm run check:csp
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' 'sha256-TJcJActYd13NpjBSk0nGx2E4azF82elp7vx/0JkRpj0=' 'sha256-n6BZkaSOFdtHJfW/KPHPGkMRxNgb4+H0jtXLcl6XEO4=' 'sha256-KfYz7ehibKpUJlNoSTSgBf4hr4NWrF0OxLVB6EiTDCA='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com; form-action 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"

# --- caching ----------------------------------------------------------------
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
